<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexcent Landing Page</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background-color: #F5F7FA; color: #4D4D4D; }
        nav { display: flex; justify-content: space-between; padding: 20px 10%; background: #fff; align-items: center; }
        .logo { font-size: 24px; font-weight: bold; }
        .logo span { color: #4CAF50; }
        nav ul { display: flex; list-style: none; }
        nav ul li { margin: 0 15px; }
        .btn { background: #4CAF50; color: white; padding: 10px 20px; border-radius: 5px; text-decoration: none; }
        .hero { display: flex; padding: 80px 10%; align-items: center; }
        .hero-text h1 { font-size: 48px; }
        .hero-text h1 span { color: #4CAF50; }
        .hero-image img { width: 100%; max-width: 400px; }
    </style>
</head>
<body>
    <nav>
        <div class="logo">Nex<span>cent</span></div>
        <ul>
            <li>Home</li>
            <li>Features</li>
            <li>Community</li>
        </ul>
        <a href="#" class="btn">Register Now →</a>
    </nav>
    <section class="hero">
        <div class="hero-text">
            <h1>DISCOVER <br><span>COLLECT GAME</span> <br>FROM US</h1>
            <p>Figma design theke banano prothom landing page.</p>
            <br>
            <a href="#" class="btn">Register</a>
        </div>
        <div class="hero-image">
            <img src="https://via.placeholder.com/400" alt="Illustration">
        </div>
    </section>
</body>
</html>
